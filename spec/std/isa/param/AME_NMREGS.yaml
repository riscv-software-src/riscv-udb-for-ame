# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: AME_NMREGS
long_name: Number of AME M and Md registers
definedBy:
  extension:
    name: Zvame
description: |
  The number of general-purpose matrix registers (`M`) and their corresponding
  datatype registers (`Md`) available in an implementation.

  When `AME_NMREGS` is 16, registers `m0`–`m15` (and `md0`–`md15`) are valid.
  When `AME_NMREGS` is 32, registers `m0`–`m31` (and `md0`–`md31`) are valid.

  Instructions encode register specifiers as 5-bit fields.  When `AME_NMREGS` is 16,
  any instruction that specifies a register whose 5-bit index has the MSB set
  (i.e., the register index is in the range 16–31) raises an `Illegal Instruction`
  exception.

  [IMPORTANT]
  Implementations with different `AME_NMREGS` values are not binary compatible
  for code that references registers `m16`–`m31`.
schema:
  type: integer
  enum: [16, 32]
