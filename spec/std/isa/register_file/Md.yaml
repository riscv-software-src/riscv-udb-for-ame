# yaml-language-server: $schema=../../../schemas/register_file_schema.json

$schema: register_file_schema.json#
kind: register_file
name: Md
long_name: Attached Matrix General-purpose Datatype Registers
description: |
  `Md` registers hold the datatype of the same-indexed `M` register.

  An `Md` register holds two 8-bit datatype specifiers:

    1. In bits 7:0, the datatype of elements held in the the same-indexed `M` register.
    1. In bits 15:8, the datatype of memory backing the elements -- that is, the datatype used by loads and stores.
definedBy: Zvame
register_class: matrix
register_length(): return 16;
registers:
  - name: md0
    abi_mnemonics: [md0]
    caller_saved: true
    roles: [temporary]
    description: Datatype register
