# yaml-language-server: $schema=../../../schemas/register_file_schema.json

$schema: register_file_schema.json#
kind: register_file
name: M
long_name: Attached Matrix General-purpose Registers
description: |
  `M` registers are used as the data operand of load or store instructions,
  the input operands of 1D (element-wise/vector) operations, and the output operands of 1D operations.

  The number of available `M` registers is `AME_NUM_M_REGS` (16 or 32).
definedBy: Zvame
register_class: matrix
register_length(): return AME_NELEM * AME_UNIT_DATATYPE_SIZE;
registers:
  - name: m0
    abi_mnemonics: [m0]
    caller_saved: true
    roles: [temporary]
    description: General-purpose matrix register.
