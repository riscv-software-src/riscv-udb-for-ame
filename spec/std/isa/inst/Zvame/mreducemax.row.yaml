# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mreducemax.row
long_name: Elementwise row reduce (max)
description: |
  Reduces each row of `ms1` by maximum and broadcasts the result to all columns of the
  corresponding row in `md`.

  For each row `i` and column `j`:

    `md[i,j] = max over k of ms1[i,k]`

  All columns in each output row receive the same value (the row maximum).
  For the row add-reduction form, see `mreduceadd.row`.
  For the column max-reduction form, see `mreducemax.col`.
custom_ame:
  numpy_equivalent: "md[i] = np.max(ms1[i])"
  math_op: "D[i,:] = max~k~(A[i,k])"
  group: Reduction
definedBy:
  extension:
    name: Zvame
assembly: md, ms1
encoding:
  match: 000011100000-----001-----0101011
  variables:
    - name: md
      location: 11-7
    - name: ms1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<32> dest_dtype = Md[md];
  Bits<32> src1_dtype = Md[ms1];

  if (!ame_op_supported(AmeOperation::REDUCEMAX1D, dest_dtype, src1_dtype, src1_dtype)) {
    CSR[amestatus].UN = 1;
  } else if (ame_dtype_is_storage_only(dest_dtype) ||
      ame_dtype_is_storage_only(src1_dtype)) {
    CSR[amestatus].UN = 1;
  } else {


  ####################################################################################
  ## Calculate element/register sizes
  ####################################################################################

  U32 src1_element_size = ame_dtype_val_to_size(src1_dtype);
  U32 src1_nregs = src1_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src1_nregs == 0) {
    src1_nregs = 1;
  }
  U32 src1_elements_per_reg = AME_NELEM / src1_nregs;

  U32 dest_element_size = ame_dtype_val_to_size(dest_dtype);
  U32 dest_nregs = dest_element_size / AME_UNIT_DATATYPE_SIZE;
  if (dest_nregs == 0) {
    dest_nregs = 1;
  }
  U32 dest_elements_per_reg = AME_NELEM / dest_nregs;

  ####################################################################################
  ## Check for exceptions
  ####################################################################################

  if (!ame_op_supported(AmeOperation::REDUCEMAX1D, dest_dtype, src1_dtype, src1_dtype)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (AME_NUM_M_REGS == 16) {
    if (ms1 >= 16 || md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if ((ms1 % src1_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((md % dest_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  ####################################################################################
  ## Perform the row max-reduction and broadcast to all columns
  ####################################################################################

  U32 N = sqrt(AME_NELEM);

  for (U32 i = 0; i < N; i++) {
    # Compute the row maximum across all columns k
    Bits<AME_MAX_DTYPE_SIZE> row_result = 0;
    for (U32 k = 0; k < N; k++) {
      U32 e_src = i * N + k;
      U32 src_regno = e_src / src1_elements_per_reg;
      U32 src_hi = ((e_src + 1) * src1_element_size) - (src_regno * AME_MATRIX_REGISTER_SIZE);
      U32 src_lo = ((e_src + 1) * src1_element_size) - (src_regno * AME_MATRIX_REGISTER_SIZE);
      row_result =
        ame_op(AmeOperation::REDUCEMAX1D, src1_dtype, ame_xform_impl_to_rm(M[ms1 + src_regno], src1_dtype)[src_hi:src_lo],
               dest_dtype, row_result, dest_dtype);
    }

    # Broadcast the result to all output columns
    for (U32 j = 0; j < N; j++) {
      U32 e_dst = i * N + j;
      U32 dst_regno = e_dst / dest_elements_per_reg;
      U32 dst_hi = ((e_dst + 1) * dest_element_size) - (dst_regno * AME_MATRIX_REGISTER_SIZE);
      U32 dst_lo = ((e_dst + 1) * dest_element_size) - (dst_regno * AME_MATRIX_REGISTER_SIZE);
      M[md + dst_regno][dst_hi:dst_lo] = ame_xform_rm_to_impl(row_result, dest_dtype);
    }
  }
  }
