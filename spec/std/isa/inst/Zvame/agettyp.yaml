# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: agettyp
long_name: Get accumulator datatype
description: |
  Get the datatype of an `Acc` register by reading from `Ad`.
custom_ame:
  numpy_equivalent:
  math_op:
  group: Datatype Management
definedBy:
  extension:
    name: Zvame
assembly: xd, ad
encoding:
  match: 001101100000000--001-----0110011
  variables:
    - name: xd
      location: 11-7
    - name: ad
      location: 16-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  X[xd] = Ad[ad];
