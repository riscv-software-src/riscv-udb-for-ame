# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: msettyp
long_name: Set datatype
description: |
  Sets the datatype of an `M` register and zeros the data by writing to `Md` and zeroing `M`.
custom_ame:
  numpy_equivalent: m = np.zeros_like(m)
  math_op: D[i] = 0
  group: Datatype Management
definedBy:
  extension:
    name: Zvame
assembly: md, xs1
encoding:
  match: 00110000000------000-----0110011
  variables:
    - name: md
      location: 11-7
    - name: xs1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<32> dtype = X[xs1][31:0];

  if (AME_NUM_M_REGS == 16) {
    if (md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if (!ame_datatype_supported(dtype)) {
    CSR[amestatus].UN = 1;
  } else {
    Md[md] = X[xs1];
    M[md] = 0;
  }
