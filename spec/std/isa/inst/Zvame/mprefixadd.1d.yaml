# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mprefixadd.1d
long_name: Elementwise row prefix-sum (inclusive scan)
description: |
  Computes an inclusive prefix sum (running sum) along each row of `ms1`, stored into `md`.

  For each row `i` and column `j`:

    `md[i,j] = sum over k <= j of ms1[i,k]`

  `md[i,0] = ms1[i,0]`, `md[i,1] = ms1[i,0] + ms1[i,1]`, and so on.
  For the max-scan form, see `mprefixmax.1d`.
custom_ame:
  numpy_equivalent: "md[i] = np.cumsum(ms1[i])"
  group: Communication and Permute
definedBy:
  extension:
    name: Zvame
assembly: md, ms1
encoding:
  match: 00111000000------000-----0110011
  variables:
    - name: md
      location: 11-7
    - name: ms1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<8> dest_dtype = Md[md][7:0];
  Bits<8> src1_dtype = Md[ms1][7:0];

  ####################################################################################
  ## Calculate element/register sizes
  ####################################################################################

  U32 src1_element_size = ame_dtype_val_to_size(src1_dtype);
  U32 src1_nregs = src1_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src1_nregs == 0) {
    src1_nregs = 1;
  }
  U32 src1_elements_per_reg = AME_NELEM / src1_nregs;

  U32 dest_element_size = ame_dtype_val_to_size(dest_dtype);
  U32 dest_nregs = dest_element_size / AME_UNIT_DATATYPE_SIZE;
  if (dest_nregs == 0) {
    dest_nregs = 1;
  }
  U32 dest_elements_per_reg = AME_NELEM / dest_nregs;

  ####################################################################################
  ## Check for exceptions
  ####################################################################################

  if (!ame_op_supported(AmeOperation::PREFIXADD1D, dest_dtype, src1_dtype, src1_dtype)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (AME_NMREGS == 16) {
    if (ms1 >= 16 || md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if ((ms1 % src1_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((md % dest_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  ####################################################################################
  ## Perform the row-wise inclusive prefix sum
  ####################################################################################

  U32 N = sqrt(AME_NELEM);

  for (U32 i = 0; i < N; i++) {
    Bits<AME_MAX_DTYPE_SIZE> running = 0;
    for (U32 j = 0; j < N; j++) {
      U32 e = i * N + j;

      U32 src_regno = e / src1_elements_per_reg;
      U32 src_hi = ((e + 1) * src1_element_size) - (src_regno * AME_MATRIX_REGISTER_SIZE);
      U32 src_lo = ((e + 1) * src1_element_size) - (src_regno * AME_MATRIX_REGISTER_SIZE);

      running =
        ame_op(AmeOperation::PREFIXADD1D, src1_dtype, ame_xform_impl_to_rm(M[ms1 + src_regno])[src_hi:src_lo],
               dest_dtype, running, dest_dtype);

      U32 dst_regno = e / dest_elements_per_reg;
      U32 dst_hi = ((e + 1) * dest_element_size) - (dst_regno * AME_MATRIX_REGISTER_SIZE);
      U32 dst_lo = ((e + 1) * dest_element_size) - (dst_regno * AME_MATRIX_REGISTER_SIZE);
      M[md + dst_regno][dst_hi:dst_lo] = ame_xform_rm_to_impl(running);
    }
  }
