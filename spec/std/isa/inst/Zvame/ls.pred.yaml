# yaml-language-server: $schema=../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: ls.pred
long_name: Load square from implementation-defined format, predicated
description: |
  Loads a square from memory in the implementation-defined register format into matrix
  register `md`, conditioned elementwise on the predicate matrix register `mp`.

  The data in memory must have been previously stored in the implementation-defined
  register format (e.g., by a matching store instruction). No datatype conversion is
  performed; the in-memory layout is the exact register representation.

  For each element position, the corresponding element of `mp` is inspected. An element
  is considered _true_ if its value is negative (sign bit set), and _false_ if its value
  is zero or positive (sign bit clear). When the predicate element is true, the
  corresponding element is loaded from memory into `md`. When the predicate element is
  false, the behavior for the corresponding element in `md` is implementation-defined.

  The canonical predicate encoding is -1 (all bits set) for true and 0 (all bits clear)
  for false, but any negative value is treated as true and any non-negative value as false.

  The address must be aligned to the implementation-defined square size or 4KB,
  whichever is smaller. Otherwise, `ls.pred` raises a `Load Misaligned` exception.
custom_ame:
  numpy_equivalent:
  group: Memory
definedBy:
  extension:
    name: Zvame
assembly: md, xs1, mp
encoding:
  match: -----1000000-----000-----0110011
  variables:
    - name: md
      location: 11-7
    - name: mp
      location: 31-27
    - name: xs1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg address = X[xs1];

  if (AME_NMREGS == 16) {
    if (md >= 16 || mp >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  XReg impl_size_bytes = AME_MAX_SQUARE_SIZE >> 3;

  XReg alignment = min(impl_size_bytes, 4096);

  if (address % alignment != 0) {
    # unaligned load
    raise(ExceptionCode::LoadAddressMisaligned, mode(), $encoding);
  }

  Bits<AME_MAX_SQUARE_SIZE> loaded = read_memory_ame(address, $encoding, impl_size_bytes);

  for (U32 i=0; i < sqrt(AME_NELEM); i++) {
    for (U32 j=0; j < sqrt(AME_NELEM); j++) {
      if (ame_impl_element_is_negative(M[mp], i, j)) {
        # predicate true: load element from memory
        M[md] = ame_impl_set_element(M[md], i, j, ame_impl_get_element(loaded, i, j));
      } else {
        # predicate false: implementation-defined behavior for this element
        M[md] = ame_impl_set_element(M[md], i, j, ame_impl_predicated_value(loaded, i, j));
      }
    }
  }
