# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mcolzip.1d
long_name: Elementwise column zip (interleave)
description: |
  Interleaves the lower and upper halves of each row of `ms1` into `md`.

  Let `N = sqrt(AME_NELEM)`. For each row `i` and index `j` in `[0, N/2)`:

    `md[i, 2j]   = ms1[i, j]`
    `md[i, 2j+1] = ms1[i, j + N/2]`

  The lower half of each row occupies even columns in the output; the upper half
  occupies odd columns.  Inverse of `mcolunzip.1d`.
custom_ame:
  numpy_equivalent: "conceptual: interleave lower and upper halves of each row"
  math_op: "D[i,2j] = A[i,j]; D[i,2j+1] = A[i, N/2+j]"
  group: Permutation
definedBy:
  extension:
    name: Zvame
assembly: md, ms1
encoding:
  match: 00110000000------000-----0110011
  variables:
    - name: md
      location: 11-7
    - name: ms1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<32> dest_dtype = Md[md];
  Bits<32> src1_dtype = Md[ms1];

  if (!ame_op_supported(AmeOperation::COLZIP1D, dest_dtype, src1_dtype, src1_dtype)) {
    CSR[amestatus].UN = 1;
  } else if (ame_dtype_is_storage_only(dest_dtype) ||
      ame_dtype_is_storage_only(src1_dtype)) {
    CSR[amestatus].UN = 1;
  } else {


  ####################################################################################
  ## Calculate element/register sizes
  ####################################################################################

  U32 src1_element_size = ame_dtype_val_to_size(src1_dtype);
  U32 src1_nregs = src1_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src1_nregs == 0) {
    src1_nregs = 1;
  }
  U32 src1_elements_per_reg = AME_NELEM / src1_nregs;

  U32 dest_element_size = ame_dtype_val_to_size(dest_dtype);
  U32 dest_nregs = dest_element_size / AME_UNIT_DATATYPE_SIZE;
  if (dest_nregs == 0) {
    dest_nregs = 1;
  }
  U32 dest_elements_per_reg = AME_NELEM / dest_nregs;

  ####################################################################################
  ## Check for exceptions
  ####################################################################################

  if (!ame_op_supported(AmeOperation::COLZIP1D, dest_dtype, src1_dtype, src1_dtype)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (AME_NUM_M_REGS == 16) {
    if (ms1 >= 16 || md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if ((ms1 % src1_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((md % dest_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  ####################################################################################
  ## Perform the column zip: interleave lower and upper halves of each row
  ####################################################################################

  U32 N = sqrt(AME_NELEM);

  for (U32 i = 0; i < N; i++) {
    for (U32 j = 0; j < N / 2; j++) {
      # lower half: ms1[i,j] -> md[i,2j]
      U32 e_src_lo = i * N + j;
      U32 e_dst_lo = i * N + 2 * j;

      U32 src_lo_regno = e_src_lo / src1_elements_per_reg;
      U32 src_lo_hi = ((e_src_lo + 1) * src1_element_size) - (src_lo_regno * AME_MATRIX_REGISTER_SIZE);
      U32 src_lo_lo = ((e_src_lo + 1) * src1_element_size) - (src_lo_regno * AME_MATRIX_REGISTER_SIZE);

      U32 dst_lo_regno = e_dst_lo / dest_elements_per_reg;
      U32 dst_lo_hi = ((e_dst_lo + 1) * dest_element_size) - (dst_lo_regno * AME_MATRIX_REGISTER_SIZE);
      U32 dst_lo_lo = ((e_dst_lo + 1) * dest_element_size) - (dst_lo_regno * AME_MATRIX_REGISTER_SIZE);

      M[md + dst_lo_regno][dst_lo_hi:dst_lo_lo] =
        ame_xform_rm_to_impl(ame_op(AmeOperation::COLZIP1D, src1_dtype, ame_xform_impl_to_rm(M[ms1 + src_lo_regno])[src_lo_hi:src_lo_lo],
               src1_dtype, ame_xform_impl_to_rm(M[ms1 + src_lo_regno])[src_lo_hi:src_lo_lo], dest_dtype));

      # upper half: ms1[i, j+N/2] -> md[i,2j+1]
      U32 e_src_hi = i * N + j + N / 2;
      U32 e_dst_hi = i * N + 2 * j + 1;

      U32 src_hi_regno = e_src_hi / src1_elements_per_reg;
      U32 src_hi_hi = ((e_src_hi + 1) * src1_element_size) - (src_hi_regno * AME_MATRIX_REGISTER_SIZE);
      U32 src_hi_lo = ((e_src_hi + 1) * src1_element_size) - (src_hi_regno * AME_MATRIX_REGISTER_SIZE);

      U32 dst_hi_regno = e_dst_hi / dest_elements_per_reg;
      U32 dst_hi_hi = ((e_dst_hi + 1) * dest_element_size) - (dst_hi_regno * AME_MATRIX_REGISTER_SIZE);
      U32 dst_hi_lo = ((e_dst_hi + 1) * dest_element_size) - (dst_hi_regno * AME_MATRIX_REGISTER_SIZE);

      M[md + dst_hi_regno][dst_hi_hi:dst_hi_lo] =
        ame_xform_rm_to_impl(ame_op(AmeOperation::COLZIP1D, src1_dtype, ame_xform_impl_to_rm(M[ms1 + src_hi_regno])[src_hi_hi:src_hi_lo],
               src1_dtype, ame_xform_impl_to_rm(M[ms1 + src_hi_regno])[src_hi_hi:src_hi_lo], dest_dtype));
    }
  }
  }
