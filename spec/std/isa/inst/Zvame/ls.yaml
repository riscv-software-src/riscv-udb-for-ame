# yaml-language-server: $schema=../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: ls
long_name: Load square from implementation-defined format
description: |
  Loads a square from memory in the implementation-defined register format into matrix
  register `md`.

  The data in memory must have been previously stored in the implementation-defined
  register format (e.g., by a matching store instruction). No datatype conversion is
  performed; the in-memory layout is the exact register representation. All elements
  are loaded unconditionally.

  The address must be aligned to the implementation-defined square size or 4KB,
  whichever is smaller. Otherwise, `ls` raises a `Load Misaligned` exception.
custom_ame:
  numpy_equivalent:
  group: Memory
definedBy:
  extension:
    name: Zvame
assembly: md, xs1
encoding:
  match: 000001100000-----000-----0110011
  variables:
    - name: md
      location: 11-7
    - name: xs1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg address = X[xs1];

  if (AME_NMREGS == 16) {
    if (md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  XReg impl_size_bytes = AME_MAX_SQUARE_SIZE >> 3;

  XReg alignment = min(impl_size_bytes, 4096);

  if (address % alignment != 0) {
    # unaligned load
    raise(ExceptionCode::LoadAddressMisaligned, mode(), $encoding);
  }

  M[md] = read_memory_ame(address, $encoding, impl_size_bytes);
