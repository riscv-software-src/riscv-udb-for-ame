# yaml-language-server: $schema=../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: ss.pred
long_name: Store square to implementation-defined format, predicated
description: |
  Stores a square from matrix register `ms1` into memory in the implementation-defined
  register format, conditioned elementwise on the predicate matrix register `mp`.

  The data written to memory is in the same implementation-defined format used by the
  matching load instruction (`ls.pred`). No datatype conversion is performed.

  For each element position, the corresponding element of `mp` is inspected. An element
  is considered _true_ if its value is negative (sign bit set), and _false_ if its value
  is zero or positive (sign bit clear). When the predicate element is true, the
  corresponding element of `ms1` is written to memory. When the predicate element is
  false, the behavior for the corresponding memory location is implementation-defined.

  The canonical predicate encoding is -1 (all bits set) for true and 0 (all bits clear)
  for false, but any negative value is treated as true and any non-negative value as false.

  The address must be aligned to the implementation-defined square size or 4KB,
  whichever is smaller. Otherwise, `ss.pred` raises a `Store/AMO Misaligned` exception.
custom_ame:
  numpy_equivalent:
  group: Memory
definedBy:
  extension:
    name: Zvame
assembly: ms1, xs1, mp
encoding:
  match: -----1000000-----001-----0110011
  variables:
    - name: ms1
      location: 11-7
    - name: mp
      location: 31-27
    - name: xs1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg address = X[xs1];

  if (AME_NMREGS == 16) {
    if (ms1 >= 16 || mp >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  XReg impl_size_bytes = AME_MAX_SQUARE_SIZE >> 3;

  XReg alignment = min(impl_size_bytes, 4096);

  if (address % alignment != 0) {
    # unaligned store
    raise(ExceptionCode::StoreAMOAddressMisaligned, mode(), $encoding);
  }

  Bits<AME_MAX_SQUARE_SIZE> to_store;

  for (U32 i=0; i < sqrt(AME_NELEM); i++) {
    for (U32 j=0; j < sqrt(AME_NELEM); j++) {
      if (ame_impl_element_is_negative(M[mp], i, j)) {
        # predicate true: include element from ms1
        to_store = ame_impl_set_element(to_store, i, j, ame_impl_get_element(M[ms1], i, j));
      } else {
        # predicate false: implementation-defined behavior for this element
        to_store = ame_impl_set_element(to_store, i, j, ame_impl_predicated_value(M[ms1], i, j));
      }
    }
  }

  write_memory_ame(address, $encoding, to_store, impl_size_bytes);
