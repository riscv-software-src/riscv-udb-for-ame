# yaml-language-server: $schema=../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: ss.rm.pred
long_name: Store square to row-major format, predicated
description: |
  Stores a strided square from matrix register `ms1` into memory in row-major format.

  The datatype of the square in memory is determined from `Md[ms1].SD`.
  The datatype of the square in the source register is determined from `Md[ms1].RD`.
  The two do not have to be the same, though the supported mix is implementation-dependent.
  When the two datatypes are dissimilar, conversion occurs during the store operation (no explicit
  conversion instructions needed).

  Rows are stored at a stride given in xs2.
  The stride is calculated from the start of a row to the start of the next row.
  If the value in xs2 is less than the square row size (sizeof(Md[ms1].SD) * sqrt(AME_NELEM)),
  `ss.rm.pred` raises a synchronous `Illegal Instruction` exception.

  The address must be aligned to the square row size (sizeof(Md[ms1].SD) * sqrt(AME_NELEM)) or 4KB,
  whichever is smaller.
  Otherwise, ss.rm.pred raises a `Store/AMO Misaligned` exception.

  The number of rows to store is stored in bits 31:16 of xs3
  and the number of columns to store is stored in bits 15:0 of xs3.
  When xs3 is x0, then all rows and columns are stored.
  Elements from unspecified rows or columns are not written to memory.

  If xs3 is not x0 and X[xs3][31:16] or X[xs3][15:0] is zero,
  `ss.rm.pred` raises an `Illegal Instruction` exception.

  If xs3 is not x0 and X[xs3][31:16] or X[xs3][15:0] is greater than sqrt(AME_NELEM),
  `ss.rm.pred` raises an `Illegal Instruction` exception.
custom_ame:
  numpy_equivalent:
  group: Memory
definedBy:
  extension:
    name: Zvame
assembly: ms1, xs1, xs2, xs3
encoding:
  match: -----00----------001-----0110011
  variables:
    - name: ms1
      location: 11-7
    - name: xs3
      location: 31-27
    - name: xs1
      location: 19-15
    - name: xs2
      location: 24-20
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
pseudoinstructions:
  - when: xs3 == 0
    to: ss.rm ms1, xs1, xs2
operation(): |
  XReg address = X[xs1];
  Bits<8> storage_dtype = Md[ms1][15:8];
  Bits<8> reg_dtype = Md[ms1][7:0];

  if (AME_NMREGS == 16) {
    if (ms1 >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  U32 storage_element_size_bytes = ame_dtype_val_to_size(storage_dtype) >> 3;

  XReg storage_row_size_bytes = storage_element_size_bytes * sqrt(AME_NELEM);

  XReg alignment = min(storage_row_size_bytes, 4096);

  XReg num_rows = xs3 == 0 ? sqrt(AME_NELEM) : X[xs3][31:16];
  XReg num_cols = xs3 == 0 ? sqrt(AME_NELEM) : X[xs3][15:0];

  XReg stride = X[xs2];

  if (address % alignment != 0) {
    # unaligned store
    raise(ExceptionCode::StoreAMOAddressMisaligned, mode(), $encoding);
  }

  if (num_rows == 0 || num_rows > sqrt(AME_NELEM) || num_cols == 0 || num_cols > sqrt(AME_NELEM)) {
    # bad row or column count
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (xs2 != 0 && X[xs2] > AME_NELEM) {
    # element count is too large
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (stride < sqrt(AME_NELEM)) {
    # bad stride
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  Bits<AME_MAX_SQUARE_SIZE> tmp = ame_xform_impl_to_rm(M[ms1], reg_dtype);

  for (U32 i=0; i < sqrt(AME_NELEM); i++) {
    for (U32 j=0; j < sqrt(AME_NELEM); j++) {
      Bits<64> begin = i*sqrt(AME_NELEM) + j*storage_row_size_bytes;
      Bits<64> end = i*sqrt(AME_NELEM) + ((j+1)*storage_row_size_bytes - 1);

      if (i <= num_rows && j <= num_cols) {
        Bits<AME_MAX_DTYPE_SIZE> storage_data =
          ame_convert_datatype(tmp[begin:end], reg_dtype, storage_dtype);
        write_memory_ame(address + i*stride + j*storage_row_size_bytes, $encoding, storage_data, storage_row_size_bytes);
      }
    }
  }
