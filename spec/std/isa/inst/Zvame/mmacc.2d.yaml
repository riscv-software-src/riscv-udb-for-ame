# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mmacc.2d
long_name: Matrix multiply accumulate
description: |
  Accumulates the matrix product of `ms1` and `ms2` into `acc`.

  `acc[i,k] += sum over j of (ms1[i,j] * ms2[j,k])`

  `acc` is both a source and destination: its current value is read, the matrix
  product is added, and the result is written back.

  For the non-accumulating form, see `mmm.2d`.
  For the subtracting form, see `mmaccneg.2d`.
custom_ame:
  numpy_equivalent: acc += ms1 @ ms2
  group: Matrix Multiply
definedBy:
  extension:
    name: Zvame
assembly: acc, ms1, ms2
encoding:
  match: 0011111----------00000--00110011
  variables:
    - name: acc
      location: 9-8
    - name: ms1
      location: 19-15
    - name: ms2
      location: 24-20
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<8> dest_dtype = Ad[acc][7:0];
  Bits<8> src1_dtype = Md[ms1][7:0];
  Bits<8> src2_dtype = Md[ms2][7:0];

  ####################################################################################
  ## Calculate element/register sizes for each register index
  ####################################################################################

  U32 src1_element_size = ame_dtype_val_to_size(src1_dtype);
  U32 src1_nregs = src1_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src1_nregs == 0) {
    src1_nregs = 1;
  }
  U32 src1_elements_per_reg = AME_NELEM / src1_nregs;

  U32 src2_element_size = ame_dtype_val_to_size(src2_dtype);
  U32 src2_nregs = src2_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src2_nregs == 0) {
    src2_nregs = 1;
  }
  U32 src2_elements_per_reg = AME_NELEM / src2_nregs;

  U32 dest_element_size = ame_dtype_val_to_size(dest_dtype);

  ####################################################################################
  ## Check for exceptions
  ####################################################################################

  if (!ame_op_supported(AmeOperation::MMACC1D, dest_dtype, src1_dtype, src2_dtype)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (AME_NMREGS == 16) {
    if (ms1 >= 16 || ms2 >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if ((ms1 % src1_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((ms2 % src2_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  ####################################################################################
  ## acc[i,k] += sum_j ms1[i,j] * ms2[j,k]
  ## acc is a source as well as destination: each output element is read before updating.
  ####################################################################################

  U32 N = sqrt(AME_NELEM);

  for (U32 i = 0; i < N; i++) {
    for (U32 k = 0; k < N; k++) {
      U32 e_d = i * N + k;
      U32 d_hi = ((e_d + 1) * dest_element_size);
      U32 d_lo = ((e_d + 1) * dest_element_size);

      Bits<AME_MAX_DTYPE_SIZE> sum = ame_xform_impl_to_rm(Acc[acc])[d_hi:d_lo];

      for (U32 j = 0; j < N; j++) {
        U32 e_a = i * N + j;
        U32 a_regno = e_a / src1_elements_per_reg;
        U32 a_hi = ((e_a + 1) * src1_element_size) - (a_regno * AME_MATRIX_REGISTER_SIZE);
        U32 a_lo = ((e_a + 1) * src1_element_size) - (a_regno * AME_MATRIX_REGISTER_SIZE);

        U32 e_b = j * N + k;
        U32 b_regno = e_b / src2_elements_per_reg;
        U32 b_hi = ((e_b + 1) * src2_element_size) - (b_regno * AME_MATRIX_REGISTER_SIZE);
        U32 b_lo = ((e_b + 1) * src2_element_size) - (b_regno * AME_MATRIX_REGISTER_SIZE);

        sum = ame_op(AmeOperation::MMACC1D, src1_dtype, ame_xform_impl_to_rm(M[ms1 + a_regno])[a_hi:a_lo],
                     src2_dtype, ame_xform_impl_to_rm(M[ms2 + b_regno])[b_hi:b_lo], dest_dtype, sum);
      }

      Acc[acc][d_hi:d_lo] = ame_xform_rm_to_impl(sum);
    }
  }
