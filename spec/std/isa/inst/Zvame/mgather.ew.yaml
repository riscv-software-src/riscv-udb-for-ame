# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mgather.ew
long_name: Elementwise gather (take)
description: |
  Elementwise gather: for each element in each row, uses the corresponding index from `ms2`
  to select a column from the same row of `ms1`, and stores the result into `md`.

  For each row `i` and column `j`:

    `md[i,j] = ms1[i, ms2[i,j]]`

  `ms2` provides integer column indices in the range `[0, sqrt(AME_NELEM))`.
  An out-of-range index raises an `Illegal Instruction` exception.
custom_ame:
  numpy_equivalent: md[i] = ms1[i][ms2[i]]
  math_op: "D[i,j] = A[i, B[i,j]]"
  group: Permutation
definedBy:
  extension:
    name: Zvame
assembly: md, ms1, ms2
encoding:
  match: 0011000----------000-----0101011
  variables:
    - name: md
      location: 11-7
    - name: ms1
      location: 19-15
    - name: ms2
      location: 24-20
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<32> dest_dtype = Md[md];
  Bits<32> src1_dtype = Md[ms1];
  Bits<32> src2_dtype = Md[ms2];

  if (!ame_op_supported(AmeOperation::GATHER1D, dest_dtype, src1_dtype, src2_dtype)) {
    CSR[amestatus].UN = 1;
  } else if (ame_dtype_is_storage_only(dest_dtype) ||
      ame_dtype_is_storage_only(src1_dtype) ||
      ame_dtype_is_storage_only(src2_dtype)) {
    CSR[amestatus].UN = 1;
  } else {


  ####################################################################################
  ## Calculate element/register sizes for each register index
  ####################################################################################

  U32 src1_element_size = ame_dtype_val_to_size(src1_dtype);
  U32 src1_nregs = src1_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src1_nregs == 0) {
    src1_nregs = 1;
  }
  U32 src1_elements_per_reg = AME_NELEM / src1_nregs;

  U32 src2_element_size = ame_dtype_val_to_size(src2_dtype);
  U32 src2_nregs = src2_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src2_nregs == 0) {
    src2_nregs = 1;
  }
  U32 src2_elements_per_reg = AME_NELEM / src2_nregs;

  U32 dest_element_size = ame_dtype_val_to_size(dest_dtype);
  U32 dest_nregs = dest_element_size / AME_UNIT_DATATYPE_SIZE;
  if (dest_nregs == 0) {
    dest_nregs = 1;
  }
  U32 dest_elements_per_reg = AME_NELEM / dest_nregs;

  ####################################################################################
  ## Check for exceptions
  ####################################################################################

  if (!ame_op_supported(AmeOperation::GATHER1D, dest_dtype, src1_dtype, src2_dtype)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (AME_NUM_M_REGS == 16) {
    if (ms1 >= 16 || ms2 >= 16 || md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if ((ms1 % src1_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((ms2 % src2_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((md % dest_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  ####################################################################################
  ## Perform the elementwise gather
  ####################################################################################

  U32 N = sqrt(AME_NELEM);

  for (U32 i = 0; i < N; i++) {
    for (U32 j = 0; j < N; j++) {
      U32 e = i * N + j;

      U32 idx_regno = e / src2_elements_per_reg;
      U32 idx_hi = ((e + 1) * src2_element_size) - (idx_regno * AME_MATRIX_REGISTER_SIZE);
      U32 idx_lo = ((e + 1) * src2_element_size) - (idx_regno * AME_MATRIX_REGISTER_SIZE);
      U32 col_idx = ame_xform_impl_to_rm(M[ms2 + idx_regno], src2_dtype)[idx_hi:idx_lo];

      if (col_idx >= N) {
        raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
      }

      U32 e_src = i * N + col_idx;
      U32 src_regno = e_src / src1_elements_per_reg;
      U32 src_hi = ((e_src + 1) * src1_element_size) - (src_regno * AME_MATRIX_REGISTER_SIZE);
      U32 src_lo = ((e_src + 1) * src1_element_size) - (src_regno * AME_MATRIX_REGISTER_SIZE);

      U32 dst_regno = e / dest_elements_per_reg;
      U32 dst_hi = ((e + 1) * dest_element_size) - (dst_regno * AME_MATRIX_REGISTER_SIZE);
      U32 dst_lo = ((e + 1) * dest_element_size) - (dst_regno * AME_MATRIX_REGISTER_SIZE);

      Bits<AME_MAX_DTYPE_SIZE> src_value = ame_xform_impl_to_rm(M[ms1 + src_regno], src1_dtype)[src_hi:src_lo];

      M[md + dst_regno][dst_hi:dst_lo] =
        ame_xform_rm_to_impl(ame_op(AmeOperation::GATHER1D, src1_dtype, src_value, src1_dtype, src_value, dest_dtype), dest_dtype);
    }
  }
  }
