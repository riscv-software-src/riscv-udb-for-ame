# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mmux.1d
long_name: Elementwise two-way conditional select (negative)
description: |
  Elementwise two-way conditional select using the sign of `ms1` as predicate.

  For each element, `md[i] = ms2[i]` if `ms1[i] < 0` (sign bit set),
  otherwise `md[i]` is left unchanged.

  `md` is both a source and destination: when the predicate is false (sign bit clear),
  the existing element in `md` is preserved.  `ms1` serves as the predicate register:
  any negative value is treated as true.

  Complementary to `mmuxge.1d`.
custom_ame:
  numpy_equivalent: md = np.where(ms1 < 0, ms2, md)
  group: Compare and Predication
definedBy:
  extension:
    name: Zvame
assembly: md, ms1, ms2
encoding:
  match: 0001010----------000-----0110011
  variables:
    - name: md
      location: 11-7
    - name: ms1
      location: 19-15
    - name: ms2
      location: 24-20
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<8> dest_dtype = Md[md][7:0];
  Bits<8> src1_dtype = Md[ms1][7:0];
  Bits<8> src2_dtype = Md[ms2][7:0];

  ####################################################################################
  ## Calculate element/register sizes for each register index
  ####################################################################################

  U32 src1_element_size = ame_dtype_val_to_size(src1_dtype);
  U32 src1_nregs = src1_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src1_nregs == 0) {
    src1_nregs = 1;
  }
  U32 src1_elements_per_reg = AME_NELEM / src1_nregs;

  U32 src2_element_size = ame_dtype_val_to_size(src2_dtype);
  U32 src2_nregs = src2_element_size / AME_UNIT_DATATYPE_SIZE;
  if (src2_nregs == 0) {
    src2_nregs = 1;
  }
  U32 src2_elements_per_reg = AME_NELEM / src2_nregs;

  U32 dest_element_size = ame_dtype_val_to_size(dest_dtype);
  U32 dest_nregs = dest_element_size / AME_UNIT_DATATYPE_SIZE;
  if (dest_nregs == 0) {
    dest_nregs = 1;
  }
  U32 dest_elements_per_reg = AME_NELEM / dest_nregs;

  ####################################################################################
  ## Check for exceptions
  ####################################################################################

  if (!ame_op_supported(AmeOperation::MUX1D, dest_dtype, src1_dtype, src2_dtype)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (AME_NMREGS == 16) {
    if (ms1 >= 16 || ms2 >= 16 || md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if ((ms1 % src1_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((ms2 % src2_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  if ((md % dest_nregs) != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  ####################################################################################
  ## Perform the elementwise two-way conditional select
  ## md is a source as well as destination: elements where the predicate is false are
  ## read from md and written back unchanged.
  ####################################################################################

  Bits<AME_MATRIX_REGISTER_SIZE> src1_value = ame_xform_impl_to_rm(M[ms1 + src1_regno]);
  Bits<AME_MATRIX_REGISTER_SIZE> src2_value = ame_xform_impl_to_rm(M[ms2 + src2_regno]);
  Bits<AME_MATRIX_REGISTER_SIZE> dest_value = ame_xform_impl_to_rm(M[md + dest_regno]);
  Bits<AME_MATRIX_REGISTER_SIZE> result;

  for (U32 e = 0; e < AME_NELEM; e++) {
    U32 src1_regno = e / src1_elements_per_reg;
    U32 src1_hi_idx = ((e + 1) * src1_element_size) - (src1_regno * (AME_MATRIX_REGISTER_SIZE));
    U32 src1_lo_idx = ((e + 1) * src1_element_size) - (src1_regno * (AME_MATRIX_REGISTER_SIZE));

    U32 src2_regno = e / src2_elements_per_reg;
    U32 src2_hi_idx = ((e + 1) * src2_element_size) - (src2_regno * (AME_MATRIX_REGISTER_SIZE));
    U32 src2_lo_idx = ((e + 1) * src2_element_size) - (src2_regno * (AME_MATRIX_REGISTER_SIZE));

    U32 dest_regno = e / dest_elements_per_reg;
    U32 dest_hi_idx = ((e + 1) * dest_element_size) - (dest_regno * (AME_MATRIX_REGISTER_SIZE));
    U32 dest_lo_idx = ((e + 1) * dest_element_size) - (dest_regno * (AME_MATRIX_REGISTER_SIZE));

    Bits<AME_MAX_DTYPE_SIZE> src1_element_value = src1_value[src1_hi_idx:src1_lo_idx];
    Bits<AME_MAX_DTYPE_SIZE> src2_element_value = src2_value[src2_hi_idx:src2_lo_idx];
    Bits<AME_MAX_DTYPE_SIZE> dest_current = dest_value[dest_hi_idx:dest_lo_idx];

    result =
      ame_op(AmeOperation::MUX1D, src1_dtype, src1_element_value, src2_dtype, src2_element_value, dest_dtype, dest_current);
  }

  M[md + dest_regno][dest_hi_idx:dest_lo_idx] = ame_xform_rm_to_impl(result);
