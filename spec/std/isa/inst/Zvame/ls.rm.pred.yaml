# yaml-language-server: $schema=../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: ls.rm.pred
long_name: Load square from row-major format, predicated
description: |
  Loads a strided square from memory in row-major format.

  The datatype of the square is determined from the destination register `dtype`.

  Rows are loaded at a stride given in xs2.
  The stride is calculated from the start of a row to the start of the next row.
  If the value in xs2 is less than the square row size (dtype_sz * sqrt(AME_NELEM),
  `ls.rm.pred` raises a synchronous `Illegal Instruction` exception.

  The address must be aligned to the square row size (dtype_sz * sqrt(AME_NELEM)) or 4KB,
  whichever is smaller.
  Otherwise, ls.rm.pred raises a `Load Misaligned` exception.

  The number of rows to load is stored in bits 31:16 of xs3
  and the number of columns to load is stored in bits 15:0 of xs3.
  When xs3 is x0, then all rows and columns are loaded.
  Elements from unloaded rows or columns are written as zero into the register.

  If xs3 is not x0 and X[xs3][31:16] or X[xs3][15:0] is zero,
  `ls.rm.pred` raises an `Illegal Instruction` exception.

  If xs3 is not x0 and X[xs3][31:16] or X[xs3][15:0] is greater than sqrt(AME_NELEM),
  `ls.rm.pred` raises an `Illegal Instruction` exception.

definedBy:
  extension:
    name: Zvame
assembly: md, xs1, xs2, xs3
encoding:
  match: -----00----------0000----0110011
  variables:
    - name: md
      location: 10-7
    - name: xs3
      location: 31-27
    - name: xs1
      location: 19-15
    - name: xs2
      location: 24-20
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
pseudoinstructions:
  - when: xs3 == 0
    to: ls.rm md, xs1, xs2
operation(): |
  XReg address = X[xs1];

  XReg dtype_size_bytes = ame_dtype_size(md) >> 3;

  XReg row_size_bytes = dtype_size_bytes * sqrt(AME_NELEM);

  XReg alignment = min(row_size_bytes, 4096);

  XReg num_rows = xs3 == 0 ? sqrt(AME_NELEM) : X[xs3][31:16];
  XReg num_cols = xs3 == 0 ? sqrt(AME_NELEM) : X[xs3][15:0];

  XReg stride = X[xs2];

  if (address % alignment != 0) {
    # unaligned load
    raise(ExceptionCode::LoadAddressMisaligned, mode(), $encoding);
  }

  if (num_rows == 0 || num_rows > sqrt(AME_NELEM) || num_cols == 0 || num_cols > sqrt(AME_NELEM)) {
    # bad row or column count
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (xs2 != 0 && X[xs2] > AME_NELEM) {
    # element count is too large
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (stride < sqrt(AME_NELEM)) {
    # bad stride
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  Bits<AME_MAX_SQUARE_SIZE> tmp;

  for (U32 i=0; i < sqrt(AME_NELEM); i++) {
    for (U32 j=0; j < sqrt(AME_NELEM); j++) {
      Bits<64> begin = i*sqrt(AME_NELEM) + j*dtype_size_bytes;
      Bits<64> end = i*sqrt(AME_NELEM) + ((j+1)*dtype_size_bytes - 1);

      if (i > num_rows || j > num_cols) {
        tmp[begin:end] = 0;
      } else {
        tmp[begin:end] =
          read_memory_ame(address + i*stride + j*dtype_size_bytes, $encoding, dtype_size_bytes);
      }
    }
  }

  m[md] = ame_xform_square_from_rm(tmp);
