# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mconv.1d
long_name: Convert between storage-only and compute datatypes
description: |
  Converts element data between a storage-only datatype and a compute datatype.

  The source datatype is determined from `Md[ms1]` and the destination datatype from `Md[md]`.
  Exactly one of the two must be a storage-only datatype (size < `AME_UNIT_DATATYPE_SIZE`);
  if both or neither are storage-only, `mconv.1d` sets `amestatus.UN` and returns without
  modifying any register.

  **Expand (storage-only → compute):** When `Md[ms1]` is storage-only and `Md[md]` is a
  compute datatype, `ms1` holds `pack_factor = AME_UNIT_DATATYPE_SIZE / sizeof(Md[ms1])`
  packed squares. `mconv.1d` converts each element from the storage datatype to the compute
  datatype and writes `pack_factor` result squares to `md`, `md+1`, ..., `md+pack_factor-1`.
  The register index `md` must be a multiple of `pack_factor`; otherwise,
  `mconv.1d` raises an `Illegal Instruction` exception.

  **Compress (compute → storage-only):** When `Md[ms1]` is a compute datatype and `Md[md]`
  is storage-only, `ms1`, `ms1+1`, ..., `ms1+pack_factor-1` each hold one compute-dtype square.
  `mconv.1d` converts each element from the compute datatype to the storage datatype and packs
  all `pack_factor` result squares into the single register `md`.
  The register index `ms1` must be a multiple of `pack_factor`; otherwise,
  `mconv.1d` raises an `Illegal Instruction` exception.

  The specific element-level conversion (e.g., sign extension, truncation, rounding) is
  implementation-defined and discoverable via `amestatus.UN`.
custom_ame:
  numpy_equivalent:
  math_op: "D[i] = convert(A[i], Md[md])"
  group: Register move / data conversion
definedBy:
  extension:
    name: Zvame
assembly: md, ms1
encoding:
  # ENCODING TBD — not yet allocated
  match: 0000000-----00000010-----0110011
  variables:
    - name: md
      location: 11-7
    - name: ms1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  Bits<32> src_dtype = Md[ms1];
  Bits<32> dst_dtype = Md[md];

  if (!ame_op_supported(AmeOperation::CONV1D, dst_dtype, src_dtype, src_dtype)) {
    CSR[amestatus].UN = 1;
  } else if (ame_dtype_is_storage_only(src_dtype) == ame_dtype_is_storage_only(dst_dtype)) {
    CSR[amestatus].UN = 1;
  } else {

  if (AME_NUM_M_REGS == 16) {
    if (ms1 >= 16 || md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  if (ame_dtype_is_storage_only(src_dtype)) {
    ####################################################################################
    ## Expand: one storage-only ms1 register → pack_factor compute-dtype md registers
    ####################################################################################

    U32 src_element_size_bits = ame_dtype_val_to_size(src_dtype);
    U32 pack_factor = AME_UNIT_DATATYPE_SIZE / src_element_size_bits;
    U32 dst_element_size_bits = ame_dtype_val_to_size(dst_dtype);

    if (md % pack_factor != 0) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }

    if (AME_NUM_M_REGS == 16 && md + pack_factor > 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }

    Bits<AME_MAX_SQUARE_SIZE> packed = ame_xform_impl_to_rm(M[ms1], src_dtype);

    for (U32 sq = 0; sq < pack_factor; sq++) {
      Bits<AME_MAX_SQUARE_SIZE> result = 0;

      for (U32 e = 0; e < AME_NELEM; e++) {
        U32 src_lo = (sq * AME_NELEM + e) * src_element_size_bits;
        U32 src_hi = src_lo + src_element_size_bits - 1;
        Bits<AME_MAX_DTYPE_SIZE> element = packed[src_hi:src_lo];

        U32 dst_lo = e * dst_element_size_bits;
        U32 dst_hi = dst_lo + dst_element_size_bits - 1;
        result[dst_hi:dst_lo] =
          ame_op(AmeOperation::CONV1D, src_dtype, element, src_dtype, element, dst_dtype);
      }

      M[md + sq] = ame_xform_rm_to_impl(result, dst_dtype);
    }
  } else {
    ####################################################################################
    ## Compress: pack_factor compute-dtype ms1 registers → one storage-only md register
    ####################################################################################

    U32 dst_element_size_bits = ame_dtype_val_to_size(dst_dtype);
    U32 pack_factor = AME_UNIT_DATATYPE_SIZE / dst_element_size_bits;
    U32 src_element_size_bits = ame_dtype_val_to_size(src_dtype);

    if (ms1 % pack_factor != 0) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }

    if (AME_NUM_M_REGS == 16 && ms1 + pack_factor > 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }

    Bits<AME_MAX_SQUARE_SIZE> packed = 0;

    for (U32 sq = 0; sq < pack_factor; sq++) {
      Bits<AME_MAX_SQUARE_SIZE> src_data = ame_xform_impl_to_rm(M[ms1 + sq], src_dtype);

      for (U32 e = 0; e < AME_NELEM; e++) {
        U32 src_lo = e * src_element_size_bits;
        U32 src_hi = src_lo + src_element_size_bits - 1;
        Bits<AME_MAX_DTYPE_SIZE> element = src_data[src_hi:src_lo];

        U32 dst_lo = (sq * AME_NELEM + e) * dst_element_size_bits;
        U32 dst_hi = dst_lo + dst_element_size_bits - 1;
        packed[dst_hi:dst_lo] =
          ame_op(AmeOperation::CONV1D, src_dtype, element, src_dtype, element, dst_dtype);
      }
    }

    M[md] = ame_xform_rm_to_impl(packed, dst_dtype);
  }
  }
