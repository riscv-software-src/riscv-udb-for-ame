# yaml-language-server: $schema=../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: ls.cm.pred
long_name: Load square from column-major format, predicated
description: |
  Loads a strided square from memory in column-major format into matrix register `md`.

  The datatype of the square in memory is determined from `Md[md].SD`.
  The datatype of the square in the destination register is determined from `Md[md].RD`.
  The two do not have to be the same, though the supported mix is implementation-dependent.
  When the two datatypes are dissimilar, conversion occurs during the load operation (no explicit
  conversion instructions needed).

  Columns are loaded at a stride given in xs2.
  The stride is calculated from the start of a column to the start of the next column.
  If the value in xs2 is less than the square column size (sizeof(Md[md].SD) * sqrt(AME_NELEM)),
  `ls.cm.pred` raises a synchronous `Illegal Instruction` exception.

  The address must be aligned to the square column size (sizeof(Md[md].SD) * sqrt(AME_NELEM)) or 4KB,
  whichever is smaller.
  Otherwise, ls.cm.pred raises a `Load Misaligned` exception.

  The number of rows to load is stored in bits 31:16 of xs3
  and the number of columns to load is stored in bits 15:0 of xs3.
  When xs3 is x0, then all rows and columns are loaded.
  Elements from unloaded rows or columns are written as zero into the register.

  If xs3 is not x0 and X[xs3][31:16] or X[xs3][15:0] is zero,
  `ls.cm.pred` raises an `Illegal Instruction` exception.

  If xs3 is not x0 and X[xs3][31:16] or X[xs3][15:0] is greater than sqrt(AME_NELEM),
  `ls.cm.pred` raises an `Illegal Instruction` exception.
custom_ame:
  numpy_equivalent:
  group: Memory
definedBy:
  extension:
    name: Zvame
assembly: md, xs1, xs2, xs3
encoding:
  match: -----01----------000-----0110011
  variables:
    - name: md
      location: 11-7
    - name: xs3
      location: 31-27
    - name: xs1
      location: 19-15
    - name: xs2
      location: 24-20
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
pseudoinstructions:
  - when: xs3 == 0
    to: ls.cm md, xs1, xs2
operation(): |
  XReg address = X[xs1];
  Bits<8> storage_dtype = Md[md][15:8];
  Bits<8> reg_dtype = Md[md][7:0];

  if (AME_NMREGS == 16) {
    if (md >= 16) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  }

  U32 storage_element_size_bytes = ame_dtype_val_to_size(storage_dtype) >> 3;

  XReg storage_col_size_bytes = storage_element_size_bytes * sqrt(AME_NELEM);

  XReg alignment = min(storage_col_size_bytes, 4096);

  XReg num_rows = xs3 == 0 ? sqrt(AME_NELEM) : X[xs3][31:16];
  XReg num_cols = xs3 == 0 ? sqrt(AME_NELEM) : X[xs3][15:0];

  XReg stride = X[xs2];

  if (address % alignment != 0) {
    # unaligned load
    raise(ExceptionCode::LoadAddressMisaligned, mode(), $encoding);
  }

  if (num_rows == 0 || num_rows > sqrt(AME_NELEM) || num_cols == 0 || num_cols > sqrt(AME_NELEM)) {
    # bad row or column count
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (xs2 != 0 && X[xs2] > AME_NELEM) {
    # element count is too large
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  if (stride < sqrt(AME_NELEM)) {
    # bad stride
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  Bits<AME_MAX_SQUARE_SIZE> tmp;

  for (U32 j=0; j < sqrt(AME_NELEM); j++) {
    for (U32 i=0; i < sqrt(AME_NELEM); i++) {
      Bits<64> begin = j*sqrt(AME_NELEM) + i*storage_col_size_bytes;
      Bits<64> end = j*sqrt(AME_NELEM) + ((i+1)*storage_col_size_bytes - 1);

      if (i > num_rows || j > num_cols) {
        tmp[begin:end] = 0;
      } else {
        Bits<AME_MAX_DTYPE_SIZE> storage_data =
          read_memory_ame(address + j*stride + i*storage_col_size_bytes, $encoding, storage_col_size_bytes);
        tmp[begin:end] =
          ame_convert_datatype(storage_data, storage_dtype, reg_dtype);
      }
    }
  }

  M[md] = ame_xform_cm_to_impl(tmp, reg_dtype);
